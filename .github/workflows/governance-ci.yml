name: governance-ci

on:
  pull_request:
    branches: [ main ]

jobs:
  governance-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run governance check
        run: |
          chmod +x scripts/ci-governance-check.sh
          bash scripts/ci-governance-check.sh
